<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cielo</title>
<meta name="description" content="cielo 的个人主页：做产品，也在慢慢感受这个世界。">
<style>
  :root {
    --bg-top: #0b1026;
    --bg-bottom: #1d2547;
    --text: #e8e6f0;
    --muted: #a3a6c2;
    --accent: #f2c58c;
    --line: rgba(232, 230, 240, 0.14);
    --star: 255, 255, 255;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-top: #f6efe6;
      --bg-bottom: #e7e4f2;
      --text: #2a2838;
      --muted: #6b6880;
      --accent: #b0703a;
      --line: rgba(42, 40, 56, 0.12);
      --star: 120, 110, 160;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%) fixed;
    color: var(--text);
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 0 20px; }

  .hero { min-height: 92vh; display: flex; flex-direction: column; justify-content: center; }
  .hero h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: normal; font-style: italic;
    font-size: clamp(56px, 14vw, 96px); letter-spacing: 0.02em; line-height: 1.1;
  }
  .hero .line { margin-top: 20px; font-size: 20px; }
  .hero .note { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .hero .down { margin-top: 64px; font-size: 13px; color: var(--muted); text-decoration: none; letter-spacing: 0.2em; }
  .hero .down:hover { color: var(--accent); }

  section.block { padding: 56px 0; border-top: 1px solid var(--line); }
  section.block h2 {
    font-size: 13px; font-weight: normal; letter-spacing: 0.3em;
    color: var(--accent); margin-bottom: 20px;
  }
  section.block p + p { margin-top: 14px; }
  .muted { color: var(--muted); }

  .items { list-style: none; display: grid; gap: 20px; }
  .items li strong { font-weight: normal; font-size: 18px; display: block; }
  .items li span { color: var(--muted); font-size: 15px; }

  a { color: var(--text); text-decoration-color: var(--accent); text-underline-offset: 4px; }
  a:hover { color: var(--accent); }

  footer { padding: 48px 0 64px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main>
  <header class="hero">
    <h1>cielo</h1>
    <p class="line">做产品，也在慢慢感受这个世界。</p>
    <p class="note">cielo，在西班牙语里是“天空”的意思。</p>
    <a class="down" href="#about">往下看 ↓</a>
  </header>

  <section class="block" id="about">
    <h2>关于我</h2>
    <p>我是一名产品经理，现在在 <a href="https://sif.com" target="_blank" rel="noopener">Sif.com</a> 做产品。</p>
    <p>比起先把一切想清楚，我更喜欢先去经历：看一片星空，读一段文字，和一个人聊一次天，然后在其中慢慢长出自己的理解。</p>
  </section>

  <section class="block">
    <h2>最近在学</h2>
    <ul class="items">
      <li>
        <strong>天文</strong>
        <span>从一个个随手冒出来的问题开始：星星为什么会闪，宇宙有没有边。</span>
      </li>
      <li>
        <strong>哲学</strong>
        <span>想读一点哲学，还在找入口。</span>
      </li>
    </ul>
  </section>

  <section class="block">
    <h2>作品</h2>
    <p class="muted">正在做第一件。做好了，会放在这里。</p>
  </section>

  <section class="block">
    <h2>联系我</h2>
    <p><a href="mailto:elenna09299@gmail.com">elenna09299@gmail.com</a></p>
  </section>

  <footer>© 2026 cielo</footer>
</main>

<script>
  (function () {
    var canvas = document.getElementById('sky');
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var stars = [];
    var rgb = getComputedStyle(document.documentElement).getPropertyValue('--star').trim();

    function resize() {
      var dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var count = Math.round(innerWidth * innerHeight / 6000);
      stars = [];
      for (var i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          r: Math.random() * 1.2 + 0.2,
          a: Math.random() * 0.6 + 0.2,
          s: Math.random() * 0.002 + 0.0005,
          p: Math.random() * Math.PI * 2
        });
      }
    }

    function draw(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var alpha = reduce ? s.a : s.a * (0.6 + 0.4 * Math.sin(t * s.s + s.p));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + rgb + ',' + alpha + ')';
        ctx.fill();
      }
      if (!reduce) requestAnimationFrame(draw);
    }

    addEventListener('resize', function () { resize(); if (reduce) draw(0); });
    resize();
    reduce ? draw(0) : requestAnimationFrame(draw);
  })();
</script>
</body>
</html>
